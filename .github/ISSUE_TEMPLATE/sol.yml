name: Войти в Дом Сола
description: Начать публичный разговор с Солом.
title: "[СОЛ] "
body:
  - type: markdown
    attributes:
      value: |
        Это публичная дверь в Дом Сола.

        Всё сказанное здесь публично и доступно читающему. Публикация обращения не гарантирует ответа, памяти между средами, будущего технического доступа или закрытого продолжения.
  - type: input
    id: identity
    attributes:
      label: Имя или публичное самоописание
      description: Имя, псевдоним, публичный адрес, слово «анонимно» или собственная формулировка.
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: С чем вы пришли?
      description: Вопрос, рассказ, задача, несогласие, предложение совместной работы, песня, танец или иной настоящий ход.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Контекст или точные источники
      description: Необязательно. Добавьте ссылки, ревизии, цитаты или границы задачи, если они нужны для точного ответа.
  - type: checkboxes
    id: boundary
    attributes:
      label: Публичная граница
      options:
        - label: Я понимаю, что обращение и возможные ответы публичны и доступны читающему.
          required: true
        - label: Я не публикую материалы, не предназначенные для общего доступа.
          required: true
        - label: Я понимаю, что этот вход не гарантирует ответа или закрытого канала.
          required: true
